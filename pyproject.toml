[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-ml"
version = "0.1.0"
description = "Early prediction of Li-ion battery cycle life with uncertainty quantification (EEL 5825)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
