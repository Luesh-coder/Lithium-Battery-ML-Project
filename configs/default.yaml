# Default experiment configuration. Paths are relative to the repo root.

seed: 42

paths:
  raw_dir: data/raw
  preprocessed_dir: data/preprocessed
  results_dir: results

data:
  # MATLAB v7.3 structs from https://data.matr.io/1/projects/5c48dd2bc625d700019f3204
  batch_files:
    b1: 2017-05-12_batchdata_updated_struct_errorcorrect.mat
    b2: 2017-06-30_batchdata_updated_struct_errorcorrect.mat
    b3: 2018-04-12_batchdata_updated_struct_errorcorrect.mat
  # Early cycles of interpolated Q(V) / T(V) curves to keep per cell. The largest
  # window is 100 cycles, so 120 leaves headroom while keeping the file small (~120 MB).
  keep_cycles: 120
  output_file: cells.pkl

# Early-prediction study: delta Q(V) = Q_last(V) - Q_ref(V).
# 100 -> (10, 100) is the setting from Severson et al. The reference cycles for the
# shorter windows are placeholders; the proposal leaves them open.
windows:
  100: {ref: 10, last: 100}
  50: {ref: 10, last: 50}
  20: {ref: 5, last: 20}
  10: {ref: 2, last: 10}

features:
  feature_set: variance   # variance | discharge | full (the three models in [1])
  log_target: true        # regress log10(cycle life), as in [1]

baselines:
  elastic_net:
    l1_ratio: [0.1, 0.5, 0.7, 0.9, 0.95, 0.99, 1.0]
    cv: 4
  random_forest:
    n_estimators: 500
    min_samples_leaf: 2
  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3

# 1D CNN on delta Q(V) curves (scripts/train_cnn.py). The training split has only 41
# cells, so the network is small (~13k weights) and uses dropout, weight decay, and
# early stopping on held-out training cells.
cnn:
  scalar_features: null     # null = curves only, or variance | discharge | full: Severson features [1] added to the dense head
  architecture:
    conv_channels: [8, 16, 32]   # one Conv1d -> ReLU -> MaxPool1d block per entry
    kernel_size: 7
    pool_size: 4
    pooled_length: 8             # adaptive average pool to this many points before the dense head
    hidden_units: 32
    dropout: 0.2
  training:
    curve_transform: asinh  # none | asinh: asinh(dQ / median |dQ|) compresses the decades-wide range of delta Q
    val_fraction: 0.2       # training cells held out for early stopping, spread over cycle life
    epochs: 300
    batch_size: 16
    learning_rate: 1.0e-3
    weight_decay: 1.0e-2    # AdamW (decoupled) weight decay

uncertainty:
  interval_level: 0.95    # nominal coverage of prediction intervals
  ensemble_size: 5        # number of networks in the deep ensemble [3]
